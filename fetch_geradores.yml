name: Atualizar dados dos geradores (Monday)

on:
  schedule:
    # Roda a cada hora, entre 06h e 20h (horario UTC = horario de Brasilia + 3)
    - cron: "0 9-23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar-geradores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Buscar dados no Monday e gerar JSON
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: python parse_geradores.py --board-id 18415734554

      - name: Commitar alteracoes (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/geradores.json
          git diff --cached --quiet && echo "Sem mudancas" || git commit -m "Atualiza dados dos geradores (automatico)"
          git push
