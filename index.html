<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Geradores — Goiás Verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --verde-escuro: #173404;
    --verde: #3B6D11;
    --verde-claro: #639922;
    --verde-fundo: #EAF3DE;
    --texto: #2C2C2A;
    --texto-secundario: #5F5E5A;
    --texto-muted: #888780;
    --branco: #FFFFFF;
    --borda: #E3E1D8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(180deg, #F6FAF1 0%, #FFFFFF 100%);
    color: var(--texto);
    padding: 32px;
  }

  /* ---------- Ticker estilo bolsa de valores ---------- */
  .ticker-wrap {
    background: #0F1512;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
    white-space: nowrap;
  }

  .ticker-track {
    display: inline-flex;
    align-items: center;
    animation: ticker-scroll 40s linear infinite;
    padding: 10px 0;
  }

  .ticker-wrap:hover .ticker-track {
    animation-play-state: paused;
  }

  @keyframes ticker-scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .ticker-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #F1EFE8;
    border-right: 1px solid #2C332E;
  }

  .ticker-item .nome {
    font-weight: 500;
    color: #F1EFE8;
  }

  .ticker-item .valor {
    color: #B8B6AC;
  }

  .ticker-item .variacao {
    font-weight: 500;
  }

  .ticker-item .variacao.subiu { color: #97C459; }
  .ticker-item .variacao.desceu { color: #F09595; }
  .ticker-item .variacao.neutro { color: #888780; }

  .ticker-item .bolinha {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }

  .ticker-item .bolinha.ok { background: #97C459; }
  .ticker-item .bolinha.manut { background: #F09595; }

  /* ---------- Cabeçalho ---------- */
  .cabecalho {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .titulo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .titulo h1 {
    font-size: 24px;
    font-weight: 600;
    margin: 0;
  }

  .titulo p {
    font-size: 13px;
    color: var(--texto-muted);
    margin: 0;
  }

  .icone-titulo {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--verde);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 22px;
  }

  .lado-direito {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  #atualizado {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--texto-muted);
  }

  .btn-monday {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--verde);
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 8px;
    transition: background 0.15s ease;
  }

  .btn-monday:hover {
    background: var(--verde-escuro);
  }

  .btn-monday svg {
    width: 15px;
    height: 15px;
  }

  /* ---------- KPIs ---------- */
  .kpis {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
    margin-bottom: 24px;
  }

  .kpi {
    background: var(--branco);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 16px 18px;
  }

  .kpi.destaque { background: var(--verde-fundo); border-color: var(--verde-fundo); }
  .kpi.alerta-kpi { background: #FDF4F4; border-color: #FDF4F4; }
  .kpi.disponibilidade { background: var(--verde-escuro); border-color: var(--verde-escuro); }

  .kpi p.label {
    font-size: 13px;
    color: var(--texto-secundario);
    margin: 0 0 6px;
  }

  .kpi.destaque p.label { color: var(--verde); }
  .kpi.alerta-kpi p.label { color: #A32D2D; }
  .kpi.disponibilidade p.label { color: #C0DD97; }

  .kpi p.valor {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 500;
    margin: 0;
  }

  .kpi.destaque p.valor { color: var(--verde-escuro); }
  .kpi.alerta-kpi p.valor { color: #A32D2D; }
  .kpi.disponibilidade p.valor { color: #FFFFFF; }

  /* ---------- Cards ---------- */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .card {
    background: var(--branco);
    border-radius: 12px;
    border: 1px solid var(--borda);
    border-left: 4px solid var(--verde);
    padding: 16px;
    position: relative;
  }

  .card.alerta { border-left-color: #BA7517; }
  .card.critico { border-left-color: #A32D2D; border-left-width: 6px; background: #FDF4F4; }

  .card.mudou-agora {
    animation: pulso-borda 2s ease-in-out infinite;
  }

  @keyframes pulso-borda {
    0%, 100% { box-shadow: 0 0 0 0 rgba(163, 45, 45, 0.35); }
    50% { box-shadow: 0 0 0 6px rgba(163, 45, 45, 0); }
  }

  .selo-novo {
    position: absolute;
    top: -8px;
    right: 12px;
    background: #A32D2D;
    color: white;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    letter-spacing: 0.03em;
  }

  .card-topo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .card-topo span.nome {
    font-size: 15px;
    font-weight: 600;
  }

  .card p.serie {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--texto-muted);
    margin: 0 0 10px;
  }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--verde-fundo);
    color: var(--verde-escuro);
    margin-bottom: 12px;
  }

  .badge.alerta { background: #FAEEDA; color: #633806; }
  .badge.critico { background: #FCEBEB; color: #501313; }

  .linha-horimetro {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .linha-horimetro span.rotulo {
    font-size: 11px;
    color: var(--texto-secundario);
  }

  .linha-horimetro span.valor {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 500;
  }

  .linha-horimetro span.delta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    margin-left: 6px;
  }

  .linha-horimetro span.delta.subiu { color: var(--verde); }
  .linha-horimetro span.delta.desceu { color: #A32D2D; }

  .barra-fundo {
    height: 6px;
    background: var(--verde-fundo);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .barra-preenchida {
    height: 100%;
    background: var(--verde-claro);
  }

  .card-rodape {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--texto-secundario);
  }

  .card-observacao {
    font-size: 11px;
    color: var(--texto-secundario);
    background: #F6FAF1;
    border-radius: 6px;
    padding: 6px 8px;
    margin-top: 10px;
    line-height: 1.4;
  }

  .card-observacao strong {
    color: var(--verde);
    font-weight: 600;
  }

  .status-em-dia { color: var(--verde); font-weight: 600; }
  .status-alerta-txt { color: #BA7517; font-weight: 600; }
  .status-critico-txt { color: #A32D2D; font-weight: 600; }

  #erro {
    display: none;
    background: #FCEBEB;
    color: #501313;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    margin-bottom: 20px;
  }

  @media (max-width: 1200px) {
    .kpis { grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 1100px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 700px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

  <div class="ticker-wrap">
    <div class="ticker-track" id="ticker-track"></div>
  </div>

  <div class="cabecalho">
    <div class="titulo">
      <div class="icone-titulo">⚡</div>
      <div>
        <h1>Painel de geradores</h1>
        <p>Goiás Verde Alimentos · PCM</p>
      </div>
    </div>
    <div class="lado-direito">
      <span id="atualizado">carregando...</span>
      <a class="btn-monday" href="https://messigean18s-team.monday.com/boards/18415734554" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14M13 6l6 6-6 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Análise no Monday
      </a>
    </div>
  </div>

  <div id="erro"></div>

  <div class="kpis" id="kpis"></div>

  <div class="cards" id="cards"></div>

  <script>
    const CAMINHO_JSON = "data/geradores.json";
    const HORIMETRO_MAXIMO = 550; // referencia para a barra de progresso
    const JANELA_DESTAQUE_HORAS = 2; // por quanto tempo o selo "mudou agora" fica visivel

    function classificarStatus(texto) {
      const t = (texto || "").toLowerCase();
      if (t.includes("critico") || t.includes("crítico") || t.includes("atrasad")) return "critico";
      if (t.includes("alerta") || t.includes("proximo") || t.includes("próximo")) return "alerta";
      return "ok";
    }

    function emManutencao(statusOperacional) {
      const t = (statusOperacional || "").toLowerCase();
      return t.includes("manutenc") || t.includes("manutenç") || t.includes("parad") || t.includes("defeito");
    }

    function formatarData(iso) {
      if (!iso) return "—";
      return iso;
    }

    function mudouRecentemente(g) {
      if (!g.status_mudou || !g.status_mudou_em) return false;
      const quando = new Date(g.status_mudou_em);
      const horasPassadas = (Date.now() - quando.getTime()) / (1000 * 60 * 60);
      return horasPassadas < JANELA_DESTAQUE_HORAS;
    }

    async function carregar() {
      try {
        const resp = await fetch(CAMINHO_JSON, { cache: "no-store" });
        if (!resp.ok) throw new Error("Nao foi possivel carregar " + CAMINHO_JSON);
        const dados = await resp.json();
        renderizar(dados);
      } catch (e) {
        document.getElementById("erro").style.display = "block";
        document.getElementById("erro").textContent =
          "Não foi possível carregar os dados dos geradores. Verifique se data/geradores.json existe e se o workflow do GitHub Actions já rodou.";
        console.error(e);
      }
    }

    function renderizarTicker(geradores) {
      const trackEl = document.getElementById("ticker-track");

      const montarItem = g => {
        const emManut = emManutencao(g.status_operacional);
        const delta = g.delta_horimetro;
        let variacaoTexto = "—";
        let variacaoClasse = "neutro";
        if (delta != null) {
          if (delta > 0) { variacaoTexto = `▲ +${delta.toFixed(1)}h`; variacaoClasse = "subiu"; }
          else if (delta < 0) { variacaoTexto = `▼ ${delta.toFixed(1)}h`; variacaoClasse = "desceu"; }
          else { variacaoTexto = "• 0.0h"; variacaoClasse = "neutro"; }
        }
        const bolinhaClasse = emManut ? "manut" : "ok";
        const horimetroTexto = g.horimetro != null ? g.horimetro.toFixed(1) + "h" : "—";
        return `
          <span class="ticker-item">
            <span class="bolinha ${bolinhaClasse}"></span>
            <span class="nome">${g.equipamento}</span>
            <span class="valor">${horimetroTexto}</span>
            <span class="variacao ${variacaoClasse}">${variacaoTexto}</span>
          </span>
        `;
      };

      const itensHtml = geradores.map(montarItem).join("");
      // Duplica a sequencia para o efeito de rolagem continua (translateX -50%)
      trackEl.innerHTML = itensHtml + itensHtml;
    }

    function renderizar(dados) {
      const geradores = dados.geradores || [];
      const dataAtualizacao = new Date(dados.atualizado_em);
      document.getElementById("atualizado").textContent =
        "atualizado " + dataAtualizacao.toLocaleDateString("pt-BR") + " " + dataAtualizacao.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

      renderizarTicker(geradores);

      const total = geradores.length;
      const operando = geradores.filter(g => (g.status_operacional || "").toLowerCase().includes("operando")).length;
      const emManutTotal = geradores.filter(g => emManutencao(g.status_operacional)).length;
      const emDia = geradores.filter(g => classificarStatus(g.status) === "ok").length;
      const disponibilidade = total > 0 ? Math.round((operando / total) * 100) : 0;
      const proximas = geradores
        .map(g => g.proxima_preventiva)
        .filter(Boolean)
        .sort();
      const proximaGeral = proximas.length ? proximas[0] : "—";

      const kpisEl = document.getElementById("kpis");
      kpisEl.innerHTML = `
        <div class="kpi disponibilidade">
          <p class="label">Disponibilidade da frota</p>
          <p class="valor">${disponibilidade}%</p>
        </div>
        <div class="kpi">
          <p class="label">Total de geradores</p>
          <p class="valor">${total}</p>
        </div>
        <div class="kpi destaque">
          <p class="label">Operando</p>
          <p class="valor">${operando}/${total}</p>
        </div>
        <div class="kpi alerta-kpi">
          <p class="label">Em manutenção</p>
          <p class="valor">${emManutTotal}/${total}</p>
        </div>
        <div class="kpi destaque">
          <p class="label">Em dia (preventiva)</p>
          <p class="valor">${emDia}/${total}</p>
        </div>
        <div class="kpi">
          <p class="label">Próxima preventiva</p>
          <p class="valor">${formatarData(proximaGeral)}</p>
        </div>
      `;

      const cardsEl = document.getElementById("cards");
      cardsEl.innerHTML = "";
      geradores.forEach(g => {
        const emManut = emManutencao(g.status_operacional);
        const classe = emManut ? "critico" : classificarStatus(g.status);
        const pct = g.horimetro != null ? Math.min(100, Math.round((g.horimetro / HORIMETRO_MAXIMO) * 100)) : 0;
        const textoStatus = classificarStatus(g.status) === "ok" ? "Em dia" : (classificarStatus(g.status) === "alerta" ? "Atenção" : "Atrasado");
        const classeTexto = classificarStatus(g.status) === "ok" ? "status-em-dia" : (classificarStatus(g.status) === "alerta" ? "status-alerta-txt" : "status-critico-txt");
        const temObservacao = g.observacoes && g.observacoes.trim().length > 0;
        const destacarMudanca = mudouRecentemente(g);

        let deltaHtml = "";
        if (g.delta_horimetro != null && g.delta_horimetro !== 0) {
          const subiu = g.delta_horimetro > 0;
          deltaHtml = `<span class="delta ${subiu ? "subiu" : "desceu"}">${subiu ? "▲" : "▼"} ${Math.abs(g.delta_horimetro).toFixed(1)}h</span>`;
        }

        const card = document.createElement("div");
        card.className = "card" + (classe === "alerta" ? " alerta" : classe === "critico" ? " critico" : "") + (destacarMudanca ? " mudou-agora" : "");
        card.innerHTML = `
          ${destacarMudanca ? `<span class="selo-novo">Mudou agora</span>` : ""}
          <div class="card-topo">
            <span class="nome">${g.equipamento}</span>
          </div>
          <p class="serie">${g.status_operacional || ""}</p>
          <span class="badge${classe === "alerta" ? " alerta" : classe === "critico" ? " critico" : ""}">${g.status_operacional || "—"}</span>
          <div class="linha-horimetro">
            <span class="rotulo">Horímetro</span>
            <span>
              <span class="valor">${g.horimetro != null ? g.horimetro.toFixed(1) + "h" : "—"}</span>
              ${deltaHtml}
            </span>
          </div>
          <div class="barra-fundo">
            <div class="barra-preenchida" style="width:${pct}%"></div>
          </div>
          <div class="card-rodape">
            <span>Próx: ${formatarData(g.proxima_preventiva)}</span>
            <span class="${classeTexto}">${textoStatus}</span>
          </div>
          ${temObservacao ? `<div class="card-observacao"><strong>Obs:</strong> ${g.observacoes}</div>` : ""}
        `;
        cardsEl.appendChild(card);
      });
    }

    carregar();
    // Atualiza a pagina sozinha a cada 1 minuto, para uso na TV
    setInterval(carregar, 60 * 1000);
  </script>

</body>
</html>
