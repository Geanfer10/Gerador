<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Geradores — Goiás Verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --verde-escuro: #173404;
    --verde: #3B6D11;
    --verde-claro: #639922;
    --verde-fundo: #EAF3DE;
    --texto: #2C2C2A;
    --texto-secundario: #5F5E5A;
    --texto-muted: #888780;
    --branco: #FFFFFF;
    --borda: #E3E1D8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(180deg, #F6FAF1 0%, #FFFFFF 100%);
    color: var(--texto);
    padding: 32px;
  }

  /* ---------- Ticker estilo bolsa de valores ---------- */
  .ticker-wrap {
    background: #0F1512;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
    white-space: nowrap;
  }

  .ticker-track {
    display: inline-flex;
    align-items: center;
    animation: ticker-scroll 40s linear infinite;
    padding: 10px 0;
  }

  .ticker-wrap:hover .ticker-track {
    animation-play-state: paused;
  }

  @keyframes ticker-scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .ticker-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #F1EFE8;
    border-right: 1px solid #2C332E;
  }

  .ticker-item .nome {
    font-weight: 500;
    color: #F1EFE8;
  }

  .ticker-item .valor {
    color: #B8B6AC;
  }

  .ticker-item .variacao {
    font-weight: 500;
  }

  .ticker-item .variacao.subiu { color: #97C459; }
  .ticker-item .variacao.desceu { color: #F09595; }
  .ticker-item .variacao.neutro { color: #888780; }

  .ticker-item .bolinha {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }

  .ticker-item .bolinha.ok { background: #97C459; }
  .ticker-item .bolinha.manut { background: #F09595; }

  /* ---------- Cabeçalho ---------- */
  .cabecalho {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .titulo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .titulo h1 {
    font-size: 24px;
    font-weight: 600;
    margin: 0;
  }

  .titulo p {
    font-size: 13px;
    color: var(--texto-muted);
    margin: 0;
  }

  .icone-titulo {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--verde);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 22px;
  }

  .lado-direito {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  #atualizado {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--texto-muted);
  }

  .btn-monday {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--verde);
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 8px;
    transition: background 0.15s ease;
  }

  .btn-monday:hover {
    background: var(--verde-escuro);
  }

  .btn-monday svg {
    width: 15px;
    height: 15px;
  }

  .btn-filtro {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--branco);
    color: var(--texto);
    border: 1px solid var(--borda);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .btn-filtro:hover {
    background: var(--verde-fundo);
  }

  .btn-filtro.ativo {
    background: #A32D2D;
    border-color: #A32D2D;
    color: white;
  }

  /* ---------- Ranking de uso ---------- */
  .ranking {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-bottom: 24px;
  }

  .ranking-card {
    background: var(--branco);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .ranking-icone {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .ranking-card.mais .ranking-icone { background: #FDF4F4; color: #A32D2D; }
  .ranking-card.menos .ranking-icone { background: var(--verde-fundo); color: var(--verde); }

  .ranking-texto p.label {
    font-size: 12px;
    color: var(--texto-secundario);
    margin: 0 0 2px;
  }

  .ranking-texto p.nome {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
  }

  .ranking-texto p.valor {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--texto-secundario);
    margin: 2px 0 0;
  }

  /* ---------- KPIs ---------- */
  .kpis {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
    margin-bottom: 24px;
  }

  .kpi {
    background: var(--branco);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 16px 18px;
  }

  .kpi.destaque { background: var(--verde-fundo); border-color: var(--verde-fundo); }
  .kpi.alerta-kpi { background: #FDF4F4; border-color: #FDF4F4; }
  .kpi.disponibilidade { background: var(--verde-escuro); border-color: var(--verde-escuro); }

  .kpi p.label {
    font-size: 13px;
    color: var(--texto-secundario);
    margin: 0 0 6px;
  }

  .kpi.destaque p.label { color: var(--verde); }
  .kpi.alerta-kpi p.label { color: #A32D2D; }
  .kpi.disponibilidade p.label { color: #C0DD97; }

  .kpi p.valor {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 500;
    margin: 0;
  }

  .kpi.destaque p.valor { color: var(--verde-escuro); }
  .kpi.alerta-kpi p.valor { color: #A32D2D; }
  .kpi.disponibilidade p.valor { color: #FFFFFF; }

  /* ---------- Cards ---------- */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .card {
    background: var(--branco);
    border-radius: 12px;
    border: 1px solid var(--borda);
    border-left: 4px solid var(--verde);
    padding: 16px;
    position: relative;
  }

  .card.alerta { border-left-color: #BA7517; }
  .card.critico { border-left-color: #A32D2D; border-left-width: 6px; background: #FDF4F4; }

  .card.mudou-agora {
    animation: pulso-borda 2s ease-in-out infinite;
  }

  @keyframes pulso-borda {
    0%, 100% { box-shadow: 0 0 0 0 rgba(163, 45, 45, 0.35); }
    50% { box-shadow: 0 0 0 6px rgba(163, 45, 45, 0); }
  }

  .selo-novo {
    position: absolute;
    top: -8px;
    right: 12px;
    background: #A32D2D;
    color: white;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    letter-spacing: 0.03em;
  }

  .card-topo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .card-topo span.nome {
    font-size: 15px;
    font-weight: 600;
  }

  .card p.serie {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--texto-muted);
    margin: 0 0 10px;
  }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--verde-fundo);
    color: var(--verde-escuro);
    margin-bottom: 12px;
  }

  .badge.alerta { background: #FAEEDA; color: #633806; }
  .badge.critico { background: #FCEBEB; color: #501313; }

  .linha-horimetro {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .linha-horimetro span.rotulo {
    font-size: 11px;
    color: var(--texto-secundario);
  }

  .linha-horimetro span.valor {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 500;
  }

  .linha-horimetro span.delta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    margin-left: 6px;
  }

  .linha-horimetro span.delta.subiu { color: var(--verde); }
  .linha-horimetro span.delta.desceu { color: #A32D2D; }

  .barra-fundo {
    height: 6px;
    background: var(--verde-fundo);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .barra-preenchida {
    height: 100%;
    background: var(--verde-claro);
  }

  .card-rodape {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--texto-secundario);
  }

  .card-observacao {
    font-size: 11px;
    color: var(--texto-secundario);
    background: #F6FAF1;
    border-radius: 6px;
    padding: 6px 8px;
    margin-top: 10px;
    line-height: 1.4;
  }

  .card-observacao strong {
    color: var(--verde);
    font-weight: 600;
  }

  .card.escondido-pelo-filtro { display: none; }

  /* ---------- KPIs clicaveis + painel de analise ---------- */
  .kpi { cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease; position: relative; }
  .kpi:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(23, 52, 4, 0.12); }
  .kpi:focus-visible { outline: 3px solid var(--verde-claro); outline-offset: 2px; }
  .kpi .dica { position: absolute; top: 10px; right: 12px; font-size: 11px; opacity: 0.55; }

  .painel-fundo {
    position: fixed; inset: 0; background: rgba(23, 52, 4, 0.45);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .painel-fundo.aberto { display: flex; }
  .painel {
    background: var(--branco); border-radius: 14px; width: 100%; max-width: 760px;
    max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .painel-topo {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding: 18px 22px; border-bottom: 1px solid var(--borda);
  }
  .painel-topo h2 { margin: 0; font-size: 18px; }
  .painel-topo p { margin: 2px 0 0; font-size: 12px; color: var(--texto-secundario); }
  .painel-fechar {
    background: var(--verde-fundo); border: none; border-radius: 8px; width: 34px; height: 34px;
    font-size: 18px; cursor: pointer; color: var(--verde-escuro); flex-shrink: 0;
  }
  .painel-corpo { padding: 18px 22px 22px; overflow-y: auto; }
  .conf-resumo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .conf-caixa { border-radius: 10px; padding: 12px 14px; }
  .conf-caixa.ok { background: var(--verde-fundo); color: var(--verde-escuro); }
  .conf-caixa.nok { background: #FDF4F4; color: #A32D2D; }
  .conf-caixa p { margin: 0; font-size: 12px; }
  .conf-caixa strong { display: block; font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 500; }
  .conf-barra { height: 8px; border-radius: 4px; background: #F1C9C9; overflow: hidden; margin-bottom: 20px; }
  .conf-barra > div { height: 100%; background: var(--verde-claro); }
  .painel h3 { font-size: 13px; margin: 18px 0 8px; }
  .painel h3.nok { color: #A32D2D; }
  .painel h3.ok { color: var(--verde); }
  .item-analise { border: 1px solid var(--borda); border-left: 4px solid var(--verde); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .item-analise.nok { border-left-color: #A32D2D; background: #FDF4F4; }
  .item-analise .linha { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; font-weight: 600; }
  .item-analise .linha .extra { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; color: var(--texto-secundario); }
  .item-analise .motivos { font-size: 12px; color: #A32D2D; margin-top: 2px; }
  .item-analise .obs { font-size: 12px; color: var(--texto-secundario); margin-top: 6px; line-height: 1.4; }
  .item-analise .obs strong { color: var(--verde); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; }
  .chip.ok { background: var(--verde-fundo); color: var(--verde-escuro); }
  .chip.nok { background: #FCEBEB; color: #501313; font-weight: 600; }
  .card { cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(23, 52, 4, 0.12); }
  .card .ver-relatorio { font-size: 11px; color: var(--verde); font-weight: 600; margin-top: 10px; }
  .btn-link { display: inline-block; margin: 4px 8px 0 0; font-size: 12px; font-weight: 600; color: var(--verde); text-decoration: none; border: 1px solid var(--borda); border-radius: 6px; padding: 4px 10px; }
  .btn-link:hover { background: var(--verde-fundo); }
  .vazio { font-size: 13px; color: var(--texto-secundario); }
  @media (max-width: 700px) { .conf-resumo { grid-template-columns: 1fr; } }

  .status-em-dia { color: var(--verde); font-weight: 600; }
  .status-alerta-txt { color: #BA7517; font-weight: 600; }
  .status-critico-txt { color: #A32D2D; font-weight: 600; }

  #erro {
    display: none;
    background: #FCEBEB;
    color: #501313;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    margin-bottom: 20px;
  }

  @media (max-width: 1200px) {
    .kpis { grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 1100px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 700px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .ranking { grid-template-columns: 1fr; }
    .lado-direito { flex-wrap: wrap; justify-content: flex-end; }
  }
</style>
</head>
<body>

  <div class="ticker-wrap">
    <div class="ticker-track" id="ticker-track"></div>
  </div>

  <div class="cabecalho">
    <div class="titulo">
      <div class="icone-titulo">⚡</div>
      <div>
        <h1>Painel de geradores</h1>
        <p>Goiás Verde Alimentos · PCM</p>
      </div>
    </div>
    <div class="lado-direito">
      <span id="atualizado">carregando...</span>
      <button class="btn-filtro" id="btn-filtro-alertas" onclick="alternarFiltroAlertas()">Só alertas</button>
      <a class="btn-monday" href="https://messigean18s-team.monday.com/boards/18415734554" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14M13 6l6 6-6 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Análise no Monday
      </a>
    </div>
  </div>

  <div id="erro"></div>

  <div class="kpis" id="kpis"></div>

  <div class="ranking" id="ranking"></div>

  <div class="cards" id="cards"></div>

  <div class="painel-fundo" id="painel-fundo" onclick="if(event.target===this)fecharPainel()">
    <div class="painel" role="dialog" aria-modal="true" aria-labelledby="painel-titulo">
      <div class="painel-topo">
        <div>
          <h2 id="painel-titulo"></h2>
          <p id="painel-sub"></p>
        </div>
        <button class="painel-fechar" onclick="fecharPainel()" aria-label="Fechar">✕</button>
      </div>
      <div class="painel-corpo" id="painel-corpo"></div>
    </div>
  </div>

  <script>
    const CAMINHO_JSON = "data/geradores.json";
    const HORIMETRO_MAXIMO = 550; // referencia para a barra de progresso
    const JANELA_DESTAQUE_HORAS = 2; // por quanto tempo o selo "mudou agora" fica visivel
    let filtroSoAlertasAtivo = false;

    function classificarStatus(texto) {
      const t = (texto || "").toLowerCase();
      if (t.includes("não conforme") || t.includes("nao conforme") || t.includes("inconforme")) return "critico";
      if (t.includes("critico") || t.includes("crítico") || t.includes("atrasad")) return "critico";
      if (t.includes("alerta") || t.includes("proximo") || t.includes("próximo")) return "alerta";
      return "ok";
    }

    function emManutencao(statusOperacional) {
      const t = (statusOperacional || "").toLowerCase();
      return t.includes("manutenc") || t.includes("manutenç") || t.includes("parad") || t.includes("defeito");
    }

    function formatarData(iso) {
      if (!iso) return "—";
      return iso;
    }

    function mudouRecentemente(g) {
      if (!g.status_mudou || !g.status_mudou_em) return false;
      const quando = new Date(g.status_mudou_em);
      const horasPassadas = (Date.now() - quando.getTime()) / (1000 * 60 * 60);
      return horasPassadas < JANELA_DESTAQUE_HORAS;
    }

    async function carregar() {
      try {
        const resp = await fetch(CAMINHO_JSON, { cache: "no-store" });
        if (!resp.ok) throw new Error("Nao foi possivel carregar " + CAMINHO_JSON);
        const dados = await resp.json();
        renderizar(dados);
      } catch (e) {
        document.getElementById("erro").style.display = "block";
        document.getElementById("erro").textContent =
          "Não foi possível carregar os dados dos geradores. Verifique se data/geradores.json existe e se o workflow do GitHub Actions já rodou.";
        console.error(e);
      }
    }

    function renderizarTicker(geradores) {
      const trackEl = document.getElementById("ticker-track");

      const montarItem = g => {
        const emManut = emManutencao(g.status_operacional);
        const delta = g.delta_horimetro;
        let variacaoTexto = "—";
        let variacaoClasse = "neutro";
        if (delta != null) {
          if (delta > 0) { variacaoTexto = `▲ +${delta.toFixed(1)}h`; variacaoClasse = "subiu"; }
          else if (delta < 0) { variacaoTexto = `▼ ${delta.toFixed(1)}h`; variacaoClasse = "desceu"; }
          else { variacaoTexto = "• 0.0h"; variacaoClasse = "neutro"; }
        }
        const bolinhaClasse = emManut ? "manut" : "ok";
        const horimetroTexto = g.horimetro != null ? g.horimetro.toFixed(1) + "h" : "—";
        return `
          <span class="ticker-item">
            <span class="bolinha ${bolinhaClasse}"></span>
            <span class="nome">${g.equipamento}</span>
            <span class="valor">${horimetroTexto}</span>
            <span class="variacao ${variacaoClasse}">${variacaoTexto}</span>
          </span>
        `;
      };

      const itensHtml = geradores.map(montarItem).join("");
      // Duplica a sequencia para o efeito de rolagem continua (translateX -50%)
      trackEl.innerHTML = itensHtml + itensHtml;
    }

    function renderizarRanking(geradores) {
      const rankingEl = document.getElementById("ranking");
      const comHorimetro = geradores.filter(g => g.horimetro != null);
      if (comHorimetro.length < 2) {
        rankingEl.innerHTML = "";
        return;
      }

      const maisRodado = comHorimetro.reduce((a, b) => (b.horimetro > a.horimetro ? b : a));
      const menosRodado = comHorimetro.reduce((a, b) => (b.horimetro < a.horimetro ? b : a));

      rankingEl.innerHTML = `
        <div class="ranking-card mais">
          <div class="ranking-icone">▲</div>
          <div class="ranking-texto">
            <p class="label">Mais rodado</p>
            <p class="nome">${maisRodado.equipamento}</p>
            <p class="valor">${maisRodado.horimetro.toFixed(1)}h acumuladas</p>
          </div>
        </div>
        <div class="ranking-card menos">
          <div class="ranking-icone">▼</div>
          <div class="ranking-texto">
            <p class="label">Menos rodado</p>
            <p class="nome">${menosRodado.equipamento}</p>
            <p class="valor">${menosRodado.horimetro.toFixed(1)}h acumuladas</p>
          </div>
        </div>
      `;
    }

    function precisaAtencao(g) {
      const emManut = emManutencao(g.status_operacional);
      const statusPreventiva = classificarStatus(g.status);
      return emManut || statusPreventiva !== "ok";
    }

    // ---------- Analise de conformidade (usa os dados do Monday) ----------
    let ultimosGeradores = [];
    let kpiAberto = null;

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // Nao conforme = em manutencao OU preventiva atrasada ("Status" do Monday)
    function analisarConformidade(g) {
      const motivos = [];
      if (emManutencao(g.status_operacional)) motivos.push("Em manutenção (" + (g.status_operacional || "") + ")");
      if (classificarStatus(g.status) === "critico") motivos.push("Preventiva: " + (g.status || "atrasada"));
      const insp = g.inspecao;
      if (insp) {
        if (insp.nao_conformes && insp.nao_conformes.length) motivos.push("Inspeção: " + insp.nao_conformes.join(", "));
        else if (classificarStatus(insp.situacao) === "critico") motivos.push("Inspeção: situação não conforme");
      }
      return { conforme: motivos.length === 0, motivos };
    }

    function montarKpis(geradores) {
      const ehOperando = g => (g.status_operacional || "").toLowerCase().includes("operando");
      return {
        disp: { titulo: "Disponibilidade da frota", sub: "Geradores operando x fora de operação", lista: geradores },
        total: { titulo: "Total de geradores", sub: "Conformidade geral da frota (manutenção, preventiva e última inspeção)", lista: geradores },
        operando: { titulo: "Operando", sub: "Geradores em operação agora", lista: geradores.filter(ehOperando) },
        manut: { titulo: "Em manutenção", sub: "Geradores parados ou em manutenção", lista: geradores.filter(g => emManutencao(g.status_operacional)) },
        emdia: { titulo: "Em dia (preventiva)", sub: "Status da preventiva no Monday", lista: geradores },
        proxima: { titulo: "Próxima preventiva", sub: "Ordenado pela data mais próxima", lista: geradores.filter(g => g.proxima_preventiva).slice().sort((a, b) => a.proxima_preventiva.localeCompare(b.proxima_preventiva)) }
      };
    }

    function itemAnalise(g, an, kpi) {
      const extra = kpi === "proxima" ? "Próx: " + formatarData(g.proxima_preventiva)
        : (g.horimetro != null ? g.horimetro.toFixed(1) + "h" : "");
      const obs = g.observacoes && g.observacoes.trim() ? `<div class="obs"><strong>Obs:</strong> ${esc(g.observacoes)}</div>` : "";
      const insp = g.inspecao;
      let inspHtml = "";
      if (insp) {
        const chips = (insp.componentes || []).filter(c => c.status === "conforme" || c.status === "nao_conforme")
          .map(c => `<span class="chip ${c.status === "nao_conforme" ? "nok" : "ok"}">${c.status === "nao_conforme" ? "✕" : "✓"} ${esc(c.nome)}</span>`).join("");
        const todasPend = (insp.pendencias_abertas || []).slice().reverse();
        const pend = todasPend.slice(0, 3).map(p =>
          `<div class="obs"><strong>Pendência ${esc(p.status)}</strong> (${esc(p.data)}): ${esc((p.componentes || []).join(", ") || "—")}${p.observacoes ? " — " + esc(p.observacoes) : ""}</div>`).join("") + (todasPend.length > 3 ? `<div class="obs">+ ${todasPend.length - 3} pendência(s) mais antigas em aberto no Monday</div>` : "");
        inspHtml = `
          <div class="obs"><strong>Última inspeção:</strong> ${esc(insp.data)}${insp.turno ? " · " + esc(insp.turno) : ""}${insp.inspetor ? " · " + esc(insp.inspetor) : ""}</div>
          ${chips ? `<div class="chips">${chips}</div>` : ""}
          ${insp.observacoes && insp.observacoes.trim() ? `<div class="obs"><strong>Obs da inspeção:</strong> ${esc(insp.observacoes)}</div>` : ""}
          ${pend}`;
      }
      return `
        <div class="item-analise ${an.conforme ? "" : "nok"}">
          <div class="linha"><span>${esc(g.equipamento)}</span><span class="extra">${esc(g.status_operacional || "—")} · ${esc(g.status || "—")}${extra ? " · " + esc(extra) : ""}</span></div>
          ${an.motivos.length ? `<div class="motivos">${an.motivos.map(esc).join(" · ")}</div>` : ""}
          ${obs}
          ${inspHtml}
        </div>`;
    }

    function renderizarPainel() {
      if (geradorAberto) { renderizarRelatorio(); return; }
      if (!kpiAberto) return;
      const def = montarKpis(ultimosGeradores)[kpiAberto];
      const itens = def.lista.map(g => ({ g, an: analisarConformidade(g) }));
      const nok = itens.filter(i => !i.an.conforme);
      const ok = itens.filter(i => i.an.conforme);
      const pct = itens.length ? Math.round((ok.length / itens.length) * 100) : 0;
      const temObs = g => (g.observacoes && g.observacoes.trim()) || (g.inspecao && g.inspecao.observacoes && g.inspecao.observacoes.trim());
      const comObs = itens.filter(i => temObs(i.g));

      document.getElementById("painel-titulo").textContent = def.titulo;
      document.getElementById("painel-sub").textContent = def.sub + " · dados do Monday";
      document.getElementById("painel-corpo").innerHTML = `
        <div class="conf-resumo">
          <div class="conf-caixa ok"><p>Conforme</p><strong>${ok.length}</strong></div>
          <div class="conf-caixa nok"><p>Não conforme</p><strong>${nok.length}</strong></div>
        </div>
        <div class="conf-barra"><div style="width:${pct}%"></div></div>
        <h3 class="nok">Não conforme (${nok.length})</h3>
        ${nok.length ? nok.map(i => itemAnalise(i.g, i.an, kpiAberto)).join("") : `<p class="vazio">Nenhum gerador não conforme.</p>`}
        <h3 class="ok">Conforme (${ok.length})</h3>
        ${ok.length ? ok.map(i => itemAnalise(i.g, i.an, kpiAberto)).join("") : `<p class="vazio">Nenhum gerador conforme.</p>`}
        <h3>Observações (${comObs.length})</h3>
        ${comObs.length ? comObs.map(i => `<div class="item-analise ${i.an.conforme ? "" : "nok"}"><div class="linha"><span>${esc(i.g.equipamento)}</span></div><div class="obs">${esc([i.g.observacoes, i.g.inspecao && i.g.inspecao.observacoes].filter(x => x && x.trim()).join(" | "))}</div></div>`).join("") : `<p class="vazio">Sem observações registradas.</p>`}
      `;
    }

    let geradorAberto = null;

    function renderizarRelatorio() {
      const g = ultimosGeradores.find(x => x.equipamento === geradorAberto);
      if (!g) return;
      const an = analisarConformidade(g);
      const insp = g.inspecao;
      document.getElementById("painel-titulo").textContent = g.equipamento;
      document.getElementById("painel-sub").textContent = "Relatório do gerador · dados do Monday";

      const links = [
        g.url ? `<a class="btn-link" href="${esc(g.url)}" target="_blank" rel="noopener">Abrir gerador no Monday ›</a>` : "",
        insp && insp.url ? `<a class="btn-link" href="${esc(insp.url)}" target="_blank" rel="noopener">Última inspeção no Monday ›</a>` : "",
        g.relatorio_dcco ? `<a class="btn-link" href="${esc(g.url || "#")}" target="_blank" rel="noopener">Relatório DCCO: ${esc(g.relatorio_dcco)} ›</a>` : ""
      ].join("");

      let corpo = `
        <div class="conf-resumo">
          <div class="conf-caixa ${an.conforme ? "ok" : "nok"}"><p>Situação atual</p><strong style="font-size:20px">${an.conforme ? "Conforme" : "Não conforme"}</strong></div>
          <div class="conf-caixa ${emManutencao(g.status_operacional) ? "nok" : "ok"}"><p>Operação</p><strong style="font-size:20px">${esc(g.status_operacional || "—")}</strong></div>
        </div>
        ${an.motivos.length ? `<p class="motivos" style="color:#A32D2D;font-size:13px;margin:0 0 8px">${an.motivos.map(esc).join(" · ")}</p>` : ""}
        <div>${links}</div>
        <h3>Dados do gerador</h3>
        <div class="item-analise"><div class="obs" style="margin-top:0">
          Horímetro: <strong>${g.horimetro != null ? g.horimetro.toFixed(1) + "h" : "—"}</strong> ·
          Última preventiva: <strong>${esc(formatarData(g.ultima_preventiva))}</strong> ·
          Próxima: <strong>${esc(formatarData(g.proxima_preventiva))}</strong> ·
          Último teste: <strong>${esc(formatarData(g.ultimo_teste))}</strong> ·
          Preventiva: <strong>${esc(g.status || "—")}</strong>
          ${g.observacoes && g.observacoes.trim() ? `<br><strong>Obs:</strong> ${esc(g.observacoes)}` : ""}
        </div></div>`;

      if (!insp) {
        corpo += `<h3>Inspeções semanais</h3><p class="vazio">Nenhuma inspeção encontrada para este gerador.</p>`;
      } else {
        const chips = (insp.componentes || []).map(c => {
          if (c.status === "conforme") return `<span class="chip ok">✓ ${esc(c.nome)}</span>`;
          if (c.status === "nao_conforme") return `<span class="chip nok">✕ ${esc(c.nome)}</span>`;
          return `<span class="chip" style="background:#F1EFE8;color:#5F5E5A">— ${esc(c.nome)}</span>`;
        }).join("");
        const hist = (insp.historico || []).map(h => `
          <div class="item-analise ${h.nao_conformes.length ? "nok" : ""}">
            <div class="linha"><span>${esc(h.data)}${h.turno ? " · " + esc(h.turno) : ""}</span><span class="extra">${esc(h.inspetor || "")}${h.horimetro != null ? " · " + h.horimetro.toFixed(1) + "h" : ""}</span></div>
            <div class="${h.nao_conformes.length ? "motivos" : "obs"}">${h.nao_conformes.length ? "Não conforme: " + h.nao_conformes.map(esc).join(", ") : "Todos os itens conformes"}</div>
            ${h.observacoes && h.observacoes.trim() ? `<div class="obs"><strong>Obs:</strong> ${esc(h.observacoes)}</div>` : ""}
            ${h.url ? `<a class="btn-link" href="${esc(h.url)}" target="_blank" rel="noopener">Abrir no Monday ›</a>` : ""}
          </div>`).join("");
        corpo += `
          <h3>Última inspeção (${esc(insp.data)}${insp.turno ? " · " + esc(insp.turno) : ""}${insp.inspetor ? " · " + esc(insp.inspetor) : ""})</h3>
          <div class="chips" style="margin-bottom:8px">${chips}</div>
          ${insp.observacoes && insp.observacoes.trim() ? `<div class="item-analise"><div class="obs" style="margin-top:0"><strong>Obs da inspeção:</strong> ${esc(insp.observacoes)}</div></div>` : ""}
          <h3>Histórico de inspeções (${(insp.historico || []).length} mais recentes)</h3>
          ${hist}
          ${(insp.pendencias_abertas || []).length ? `<h3 class="nok">Pendências em aberto (${insp.pendencias_abertas.length})</h3>` + insp.pendencias_abertas.slice().reverse().slice(0, 5).map(p => `<div class="item-analise nok"><div class="linha"><span>${esc(p.data)}</span><span class="extra">${esc(p.status)}</span></div><div class="motivos">${esc((p.componentes || []).join(", ") || "—")}</div>${p.observacoes ? `<div class="obs">${esc(p.observacoes)}</div>` : ""}</div>`).join("") : ""}`;
      }
      document.getElementById("painel-corpo").innerHTML = corpo;
    }

    function abrirRelatorio(nome) {
      kpiAberto = null;
      geradorAberto = nome;
      renderizarRelatorio();
      document.getElementById("painel-fundo").classList.add("aberto");
    }

    function abrirPainel(chave) {
      geradorAberto = null;
      kpiAberto = chave;
      renderizarPainel();
      document.getElementById("painel-fundo").classList.add("aberto");
    }

    function fecharPainel() {
      kpiAberto = null;
      geradorAberto = null;
      document.getElementById("painel-fundo").classList.remove("aberto");
    }

    document.addEventListener("keydown", e => { if (e.key === "Escape") fecharPainel(); });
    document.getElementById("kpis").addEventListener("click", e => {
      const el = e.target.closest("[data-kpi]");
      if (el) abrirPainel(el.dataset.kpi);
    });
    document.getElementById("cards").addEventListener("click", e => {
      if (e.target.closest("a")) return;
      const el = e.target.closest(".card");
      if (el) abrirRelatorio(el.dataset.nome);
    });
    document.getElementById("cards").addEventListener("keydown", e => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const el = e.target.closest(".card");
      if (el) { e.preventDefault(); abrirRelatorio(el.dataset.nome); }
    });
    document.getElementById("kpis").addEventListener("keydown", e => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const el = e.target.closest("[data-kpi]");
      if (el) { e.preventDefault(); abrirPainel(el.dataset.kpi); }
    });

    function alternarFiltroAlertas() {
      filtroSoAlertasAtivo = !filtroSoAlertasAtivo;
      const btn = document.getElementById("btn-filtro-alertas");
      btn.textContent = filtroSoAlertasAtivo ? "Mostrar todos" : "Só alertas";
      btn.classList.toggle("ativo", filtroSoAlertasAtivo);
      aplicarFiltroAlertas();
    }

    function aplicarFiltroAlertas() {
      document.querySelectorAll(".card").forEach(card => {
        const precisa = card.dataset.precisaAtencao === "true";
        card.classList.toggle("escondido-pelo-filtro", filtroSoAlertasAtivo && !precisa);
      });
    }

    function renderizar(dados) {
      const geradores = dados.geradores || [];
      const dataAtualizacao = new Date(dados.atualizado_em);
      document.getElementById("atualizado").textContent =
        "atualizado " + dataAtualizacao.toLocaleDateString("pt-BR") + " " + dataAtualizacao.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

      renderizarTicker(geradores);
      renderizarRanking(geradores);

      const total = geradores.length;
      const operando = geradores.filter(g => (g.status_operacional || "").toLowerCase().includes("operando")).length;
      const emManutTotal = geradores.filter(g => emManutencao(g.status_operacional)).length;
      const emDia = geradores.filter(g => classificarStatus(g.status) === "ok").length;
      const disponibilidade = total > 0 ? Math.round((operando / total) * 100) : 0;
      const proximas = geradores
        .map(g => g.proxima_preventiva)
        .filter(Boolean)
        .sort();
      const proximaGeral = proximas.length ? proximas[0] : "—";

      ultimosGeradores = geradores;
      const kpisEl = document.getElementById("kpis");
      const at = 'tabindex="0" role="button"';
      kpisEl.innerHTML = `
        <div class="kpi disponibilidade" data-kpi="disp" ${at}>
          <span class="dica">ver análise ›</span>
          <p class="label">Disponibilidade da frota</p>
          <p class="valor">${disponibilidade}%</p>
        </div>
        <div class="kpi" data-kpi="total" ${at}>
          <span class="dica">ver análise ›</span>
          <p class="label">Total de geradores</p>
          <p class="valor">${total}</p>
        </div>
        <div class="kpi destaque" data-kpi="operando" ${at}>
          <span class="dica">ver análise ›</span>
          <p class="label">Operando</p>
          <p class="valor">${operando}/${total}</p>
        </div>
        <div class="kpi alerta-kpi" data-kpi="manut" ${at}>
          <span class="dica">ver análise ›</span>
          <p class="label">Em manutenção</p>
          <p class="valor">${emManutTotal}/${total}</p>
        </div>
        <div class="kpi destaque" data-kpi="emdia" ${at}>
          <span class="dica">ver análise ›</span>
          <p class="label">Em dia (preventiva)</p>
          <p class="valor">${emDia}/${total}</p>
        </div>
        <div class="kpi" data-kpi="proxima" ${at}>
          <span class="dica">ver análise ›</span>
          <p class="label">Próxima preventiva</p>
          <p class="valor">${formatarData(proximaGeral)}</p>
        </div>
      `;
      renderizarPainel(); // mantem o painel aberto atualizado a cada refresh

      const cardsEl = document.getElementById("cards");
      cardsEl.innerHTML = "";
      geradores.forEach(g => {
        const emManut = emManutencao(g.status_operacional);
        const classe = emManut ? "critico" : classificarStatus(g.status);
        const pct = g.horimetro != null ? Math.min(100, Math.round((g.horimetro / HORIMETRO_MAXIMO) * 100)) : 0;
        const textoStatus = classificarStatus(g.status) === "ok" ? "Em dia" : (classificarStatus(g.status) === "alerta" ? "Atenção" : "Atrasado");
        const classeTexto = classificarStatus(g.status) === "ok" ? "status-em-dia" : (classificarStatus(g.status) === "alerta" ? "status-alerta-txt" : "status-critico-txt");
        const temObservacao = g.observacoes && g.observacoes.trim().length > 0;
        const destacarMudanca = mudouRecentemente(g);

        let deltaHtml = "";
        if (g.delta_horimetro != null && g.delta_horimetro !== 0) {
          const subiu = g.delta_horimetro > 0;
          deltaHtml = `<span class="delta ${subiu ? "subiu" : "desceu"}">${subiu ? "▲" : "▼"} ${Math.abs(g.delta_horimetro).toFixed(1)}h</span>`;
        }

        const card = document.createElement("div");
        card.className = "card" + (classe === "alerta" ? " alerta" : classe === "critico" ? " critico" : "") + (destacarMudanca ? " mudou-agora" : "");
        card.dataset.nome = g.equipamento;
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.dataset.precisaAtencao = precisaAtencao(g) ? "true" : "false";
        card.innerHTML = `
          ${destacarMudanca ? `<span class="selo-novo">Mudou agora</span>` : ""}
          <div class="card-topo">
            <span class="nome">${g.equipamento}</span>
          </div>
          <p class="serie">${g.status_operacional || ""}</p>
          <span class="badge${classe === "alerta" ? " alerta" : classe === "critico" ? " critico" : ""}">${g.status_operacional || "—"}</span>
          <div class="linha-horimetro">
            <span class="rotulo">Horímetro</span>
            <span>
              <span class="valor">${g.horimetro != null ? g.horimetro.toFixed(1) + "h" : "—"}</span>
              ${deltaHtml}
            </span>
          </div>
          <div class="barra-fundo">
            <div class="barra-preenchida" style="width:${pct}%"></div>
          </div>
          <div class="card-rodape">
            <span>Próx: ${formatarData(g.proxima_preventiva)}</span>
            <span class="${classeTexto}">${textoStatus}</span>
          </div>
          ${temObservacao ? `<div class="card-observacao"><strong>Obs:</strong> ${g.observacoes}</div>` : ""}
          <div class="ver-relatorio">Ver relatório ›</div>
        `;
        cardsEl.appendChild(card);
      });

      aplicarFiltroAlertas();
    }

    carregar();
    // Atualiza a pagina sozinha a cada 1 minuto, para uso na TV
    setInterval(carregar, 60 * 1000);
  </script>

</body>
</html>
